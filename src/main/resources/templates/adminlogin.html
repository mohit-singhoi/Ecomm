<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ShopSphere</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .admin-login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            background: #212529;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .admin-title {
            text-align: center;
            font-weight: 700;
            color: #212529;
            margin-bottom: 5px;
        }

        .admin-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 8px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #212529;
            color: #ffffff;
            font-weight: 600;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #343a40;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            text-decoration: none;
            color: #6c757d;
        }

        .back-link a:hover {
            color: #212529;
        }

    </style>

</head>

<body>

<div class="admin-login-card">

    <!-- ADMIN ICON -->
    <div class="admin-icon">

        <i class="fa-solid fa-user-shield"></i>

    </div>


    <!-- TITLE -->
    <h2 class="admin-title">

        Admin Login

    </h2>


    <p class="admin-subtitle">

        Sign in to manage ShopSphere

    </p>


    <!-- ERROR MESSAGE -->
    <div
        th:if="${param.error}"
        class="alert alert-danger">

        <i class="fa-solid fa-circle-exclamation me-2"></i>

        Invalid admin email or password.

    </div>


    <!-- LOGOUT MESSAGE -->
    <div
        th:if="${param.logout}"
        class="alert alert-success">

        <i class="fa-solid fa-circle-check me-2"></i>

        You have been logged out successfully.

    </div>


    <!-- ADMIN LOGIN FORM -->
    <form
        th:action="@{/adminlogin}"
        method="post">


        <!-- CSRF TOKEN -->
        <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">


        <!-- EMAIL -->
        <div class="mb-3">

            <label
                for="adminEmail"
                class="form-label">

                Email

            </label>

            <input
                type="email"
                id="adminEmail"
                name="username"
                class="form-control"
                placeholder="Enter admin email"
                autocomplete="username"
                required>

        </div>


        <!-- PASSWORD -->
        <div class="mb-4">

            <label
                for="adminPassword"
                class="form-label">

                Password

            </label>

            <input
                type="password"
                id="adminPassword"
                name="password"
                class="form-control"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required>

        </div>


        <!-- LOGIN BUTTON -->
        <button
            type="submit"
            class="login-btn">

            <i class="fa-solid fa-right-to-bracket me-2"></i>

            Login as Admin

        </button>

    </form>


    <!-- BACK TO USER LOGIN -->
    <div class="back-link">

        <a th:href="@{/userlogin}">

            <i class="fa-solid fa-arrow-left me-1"></i>

            Back to User Login

        </a>

    </div>

</div>

</body>

</html>
