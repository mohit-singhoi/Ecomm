<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ShopSphere</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            background: #212529;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .admin-title {
            text-align: center;
            font-weight: 700;
            color: #212529;
            margin-bottom: 5px;
        }

        .admin-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 8px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #212529;
            color: #ffffff;
            font-weight: 600;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #343a40;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            text-decoration: none;
            color: #6c757d;
        }

        .back-link a:hover {
            color: #212529;
        }

    </style>

</head>

<body>

<div class="admin-login-card">

    <div class="admin-icon">
        <i class="fa-solid fa-user-shield"></i>
    </div>

    <h2 class="admin-title">
        Admin Login
    </h2>

    <p class="admin-subtitle">
        Sign in to manage ShopSphere
    </p>


    <!-- ERROR MESSAGE -->

    <div th:if="${errorMessage}"
         class="alert alert-danger">

        <i class="fa-solid fa-circle-exclamation me-2"></i>

        <span th:text="${errorMessage}"></span>

    </div>


    <!-- ADMIN LOGIN FORM -->

    <form th:action="@{/adminlogin}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter admin email"
                required>

        </div>


        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter admin password"
                required>

        </div>


        <button
            type="submit"
            class="login-btn">

            <i class="fa-solid fa-right-to-bracket me-2"></i>

            Login as Admin

        </button>

    </form>


    <div class="back-link">

        <a th:href="@{/userlogin}">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to User Login
        </a>

    </div>

</div>

</body>

</html>
