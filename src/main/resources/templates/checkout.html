<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopSphere</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Navbar CSS -->

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">


    <!-- Footer CSS -->

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

</head>


<body>


<!-- ================================================= -->
<!-- NAVBAR -->
<!-- ================================================= -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<!-- ================================================= -->
<!-- CHECKOUT -->
<!-- ================================================= -->

<section class="py-5">

    <div class="container">


        <!-- BACK TO CART -->

        <div class="mb-4">

            <a th:href="@{/cart}"
               class="text-decoration-none text-dark">

                <i class="fa-solid fa-arrow-left me-2"></i>

                Back to Cart

            </a>

        </div>



        <!-- TITLE -->

        <h1 class="mb-5 fw-bold">

            <i class="fa-solid fa-credit-card me-2"></i>

            Checkout

        </h1>



        <!-- ================================================= -->
        <!-- ERROR MESSAGE -->
        <!-- ================================================= -->

        <div th:if="${errorMessage}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">

            <i class="fa-solid fa-circle-exclamation me-2"></i>

            <span th:text="${errorMessage}">
                Please fill all details.
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>



        <!-- ================================================= -->
        <!-- MAIN FORM -->
        <!-- ================================================= -->

        <form th:action="@{/checkout/place-order}"
              method="post">


            <div class="row g-4">


                <!-- ================================================= -->
                <!-- CUSTOMER INFORMATION -->
                <!-- ================================================= -->

                <div class="col-lg-7">

                    <div class="card shadow-sm border-0">

                        <div class="card-body p-4">


                            <h4 class="mb-4">

                                <i class="fa-solid fa-user me-2"></i>

                                Customer Information

                            </h4>


                            <!-- FULL NAME -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       name="fullName"
                                       class="form-control"
                                       placeholder="Enter your full name"
                                       required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>


                            <!-- PHONE -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input type="tel"
                                       name="phone"
                                       class="form-control"
                                       placeholder="Enter your phone number"
                                       required>

                            </div>


                            <!-- ADDRESS -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Delivery Address
                                </label>

                                <textarea name="address"
                                          class="form-control"
                                          rows="4"
                                          placeholder="Enter your complete delivery address"
                                          required></textarea>

                            </div>


                            <!-- CITY + PIN -->

                            <div class="row">


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        City
                                    </label>

                                    <input type="text"
                                           name="city"
                                           class="form-control"
                                           placeholder="City"
                                           required>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        PIN Code
                                    </label>

                                    <input type="text"
                                           name="pinCode"
                                           class="form-control"
                                           placeholder="PIN Code"
                                           required>

                                </div>


                            </div>



                            <!-- ================================================= -->
                            <!-- PAYMENT -->
                            <!-- ================================================= -->

                            <h4 class="mt-4 mb-3">

                                <i class="fa-solid fa-wallet me-2"></i>

                                Payment Method

                            </h4>


                            <div class="form-check mb-2">

                                <input class="form-check-input"
                                       type="radio"
                                       name="payment"
                                       id="cod"
                                       value="COD"
                                       checked
                                       required>

                                <label class="form-check-label"
                                       for="cod">

                                    Cash on Delivery

                                </label>

                            </div>


                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="payment"
                                       id="online"
                                       value="ONLINE">

                                <label class="form-check-label"
                                       for="online">

                                    Online Payment

                                </label>

                            </div>


                        </div>

                    </div>

                </div>



                <!-- ================================================= -->
                <!-- ORDER SUMMARY -->
                <!-- ================================================= -->

                <div class="col-lg-5">


                    <div class="card shadow-sm border-0">


                        <div class="card-body p-4">


                            <h4 class="mb-4">

                                <i class="fa-solid fa-receipt me-2"></i>

                                Order Summary

                            </h4>



                            <!-- PRODUCTS -->

                            <div th:each="item : ${checkoutItems}"
                                 class="d-flex align-items-center mb-3">


                                <img th:src="${item.product.imageUrl}"
                                     th:alt="${item.product.name}"
                                     width="60"
                                     height="60"
                                     style="object-fit: contain;"
                                     class="me-3">


                                <div class="flex-grow-1">

                                    <h6 th:text="${item.product.name}">

                                        Product

                                    </h6>


                                    <small class="text-muted">

                                        Qty:

                                        <span th:text="${item.quantity}">
                                            1
                                        </span>

                                    </small>

                                </div>


                                <strong>

                                    ₹<span th:text="${item.itemTotal}">
                                        0
                                    </span>

                                </strong>


                            </div>



                            <hr>



                            <!-- TOTAL -->

                            <div class="d-flex justify-content-between mb-4">

                                <strong>
                                    Total
                                </strong>

                                <strong class="fs-4">

                                    ₹<span th:text="${total}">
                                        0
                                    </span>

                                </strong>

                            </div>



                            <!-- ================================================= -->
                            <!-- PLACE ORDER -->
                            <!-- ================================================= -->

                            <button type="submit"
                                    class="btn btn-success w-100">

                                <i class="fa-solid fa-check me-2"></i>

                                Place Order

                            </button>


                        </div>

                    </div>

                </div>


            </div>


        </form>

    </div>

</section>



<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<div th:replace="~{fragments/footer :: footer}"></div>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
