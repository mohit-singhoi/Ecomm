<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ShopSphere</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            font-family: Arial, Helvetica, sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .reset-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .brand-name {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #123b70;
        }

        .brand-name span {
            color: #1976d2;
        }

        .page-title {
            text-align: center;
            font-size: 23px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6c757d;
            cursor: pointer;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 0.2rem rgba(25, 118, 210, 0.15);
        }

        .reset-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.2s;
        }

        .reset-button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .password-rules {
            font-size: 12px;
            color: #6c757d;
            margin-top: 7px;
        }

        .alert {
            font-size: 14px;
            border-radius: 10px;
        }

        @media (max-width: 480px) {

            .reset-card {
                padding: 30px 22px;
            }

            .brand-name {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <!-- Logo -->

        <div class="logo-icon">
            <i class="fa-solid fa-key"></i>
        </div>


        <!-- Brand -->

        <div class="brand-name">
            Shop<span>Sphere</span>
        </div>


        <!-- Title -->

        <h2 class="page-title">
            Create New Password
        </h2>

        <p class="description">
            Enter your new password below.
            Make sure it is strong and easy for you to remember.
        </p>


        <!-- Error Message -->

        <div
            th:if="${errorMessage}"
            class="alert alert-danger"
            role="alert">

            <i class="fa-solid fa-circle-exclamation me-2"></i>

            <span th:text="${errorMessage}">
                Something went wrong.
            </span>

        </div>


        <!-- Reset Password Form -->

        <form
            th:action="@{/reset-password}"
            method="post">

            <!-- CSRF -->

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <!-- Token -->

            <input
                type="hidden"
                name="token"
                th:value="${param.token}">


            <!-- New Password -->

            <div class="mb-3">

                <label
                    for="newPassword"
                    class="form-label">

                    New Password

                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

                <div class="password-rules">
                    Password must contain at least 6 characters.
                </div>

            </div>


            <!-- Confirm Password -->

            <div class="mb-3">

                <label
                    for="confirmPassword"
                    class="form-label">

                    Confirm New Password

                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-control"
                        placeholder="Confirm new password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="reset-button">

                <i class="fa-solid fa-lock me-2"></i>

                Reset Password

            </button>

        </form>


        <!-- Back to Login -->

        <a
            th:href="@{/userlogin}"
            class="back-login">

            <i class="fa-solid fa-arrow-left me-2"></i>

            Back to Login

        </a>

    </div>

</div>


<!-- Password Visibility Script -->

<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }
}

</script>

</body>

</html>
