<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Search - ShopSphere</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
		
		<!-- Existing Navbar CSS -->

		<link rel="stylesheet" th:href="@{/css/navbar.css}">
		
		<!-- Logged-in User Navbar CSS -->

		<link rel="stylesheet" th:href="@{/css/user-navbar.css}">

		<!-- Your existing dashboard CSS -->
		
		
		<!-- Footer CSS -->
		<link rel="stylesheet"
			   th:href="@{/css/footer.css}">

</head>

<body>

    <!-- NAVBAR -->
	
	<!-- PUBLIC NAVBAR -->
	<th:block th:if="${session.loggedInUser == null}">
	    <div th:replace="~{fragments/navbar :: navbar}"></div>
	</th:block>

	<!-- LOGGED-IN USER NAVBAR -->
	<th:block th:if="${session.loggedInUser != null}">
	    <div th:replace="~{fragments/user-navbar :: userNavbar}"></div>
	</th:block>


    <div class="container py-5">

        <h2 class="mb-4">
            <i class="fa-solid fa-magnifying-glass me-2"></i>
            Search Products
        </h2>


        <!-- SEARCH FORM -->

        <form th:action="@{/search}"
              method="get"
              class="d-flex mb-5">

            <input
                type="text"
                name="keyword"
                class="form-control me-2"
                placeholder="Search products..."
                th:value="${keyword}">

            <button
                type="submit"
                class="btn btn-dark">

                <i class="fa-solid fa-search me-2"></i>

                Search

            </button>

        </form>


        <!-- PRODUCTS -->

        <div class="row g-4">

            <div
                class="col-md-4 col-lg-3"
                th:each="product : ${products}">

                <div class="card h-100 shadow-sm">

                    <img
                        th:src="${product.imageUrl}"
                        class="card-img-top"
                        style="height:220px; object-fit:cover;"
                        alt="Product">

                    <div class="card-body">

                        <h5
                            class="card-title"
                            th:text="${product.name}">
                            Product Name
                        </h5>

                        <p
                            class="text-muted"
                            th:text="${product.category}">
                            Category
                        </p>

                        <h5>
                            ₹
                            <span
                                th:text="${product.price}">
                                0
                            </span>
                        </h5>

                        <a
                            th:href="@{/products/{id}(id=${product.id})}"
                            class="btn btn-dark btn-sm mt-2">

                            View Product

                        </a>

                    </div>

                </div>

            </div>

        </div>


        <!-- NO PRODUCTS -->

        <div
            th:if="${products == null or #lists.isEmpty(products)}"
            class="text-center py-5">

            <i
                class="fa-solid fa-box-open"
                style="font-size:50px;">
            </i>

            <h4 class="mt-3">
                No products found
            </h4>

            <p class="text-muted">
                Try searching with a different keyword.
            </p>

        </div>

    </div>

	<!-- =====================================================
	     EXISTING FOOTER
	     ===================================================== -->
	<div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
