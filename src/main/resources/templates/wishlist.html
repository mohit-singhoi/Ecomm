<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wishlist - ShopSphere</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Existing Navbar CSS -->
    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <!-- Logged-in User Navbar CSS -->
    <link rel="stylesheet"
          th:href="@{/css/user-navbar.css}">

    <!-- Footer CSS -->
    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

</head>

<body>

    <!-- =====================================================
         USER NAVBAR
         ===================================================== -->

    <div th:replace="~{fragments/user-navbar :: userNavbar}">
    </div>


    <!-- =====================================================
         MAIN WISHLIST CONTENT
         ===================================================== -->

    <div class="container py-5">


        <!-- SUCCESS MESSAGE -->

        <div th:if="${successMessage}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">

            <i class="fa-solid fa-circle-check me-2"></i>

            <span th:text="${successMessage}">
                Success message
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- ERROR MESSAGE -->

        <div th:if="${errorMessage}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">

            <i class="fa-solid fa-circle-exclamation me-2"></i>

            <span th:text="${errorMessage}">
                Error message
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- =================================================
             WISHLIST HEADER
             ================================================= -->

        <div class="d-flex justify-content-between
                    align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">

                    <i class="fa-regular fa-heart me-2"></i>

                    My Wishlist

                </h2>

                <p class="text-muted mb-0">

                    Products you would like to buy later.

                </p>

            </div>


            <a th:href="@{/products}"
               class="btn btn-outline-dark">

                <i class="fa-solid fa-store me-2"></i>

                Continue Shopping

            </a>

        </div>



        <!-- =================================================
             EMPTY WISHLIST
             ================================================= -->

        <div th:if="${#lists.isEmpty(wishlistItems)}"
             class="text-center py-5">

            <i class="fa-regular fa-heart"
               style="font-size: 70px; color: #adb5bd;">
            </i>

            <h3 class="mt-4">

                Your wishlist is empty

            </h3>

            <p class="text-muted">

                Start adding products you love to your wishlist.

            </p>

            <a th:href="@{/products}"
               class="btn btn-dark">

                <i class="fa-solid fa-store me-2"></i>

                Browse Products

            </a>

        </div>



        <!-- =================================================
             WISHLIST PRODUCTS
             ================================================= -->

        <div class="row g-4"
             th:if="${!#lists.isEmpty(wishlistItems)}">


            <!-- PRODUCT CARD -->

            <div class="col-md-6 col-lg-4"
                 th:each="item : ${wishlistItems}">

                <div class="card h-100 shadow-sm border-0">


                    <!-- PRODUCT IMAGE -->

                    <div class="p-3 text-center">

                        <img th:src="${item.product.imageUrl}"
                             th:alt="${item.product.name}"
                             class="card-img-top"
                             style="height:220px;
                                    object-fit:contain;">

                    </div>


                    <!-- PRODUCT DETAILS -->

                    <div class="card-body">

                        <h5 class="fw-bold"
                            th:text="${item.product.name}">

                            Product Name

                        </h5>


                        <p class="text-muted mb-2"
                           th:text="${item.product.category}">

                            Category

                        </p>


                        <p class="text-muted small">

                            <span th:text="${item.product.description}">
                                Product description
                            </span>

                        </p>


                        <h5 class="fw-bold">

                            ₹<span
                                th:text="${item.product.price}">
                                0
                            </span>

                        </h5>

                    </div>


                    <!-- ACTIONS -->

                    <div class="card-footer bg-white border-0 pb-3">

                        <div class="d-flex gap-2">


                            <!-- VIEW PRODUCT -->

                            <a th:href="@{/products/{id}(id=${item.product.id})}"
                               class="btn btn-dark flex-grow-1">

                                <i class="fa-solid fa-eye me-1"></i>

                                View Product

                            </a>


                            <!-- REMOVE -->

                            <form
                                th:action="@{/wishlist/remove/{id}(id=${item.id})}"
                                method="post">

                                <button type="submit"
                                        class="btn btn-outline-danger"
                                        title="Remove from Wishlist">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         EXISTING FOOTER
         ===================================================== -->

    <div th:replace="~{fragments/footer :: footer}">
    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
