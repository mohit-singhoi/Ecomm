<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products | ShopSphere</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Navbar CSS -->
    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <!-- Footer CSS -->
    <link rel="stylesheet"
          th:href="@{/css/footer.css}">
	
	<!-- Footer CSS -->
	<link rel="stylesheet"
		   th:href="@{/css/products.css}">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- ================= PRODUCTS HEADER ================= -->

<section class="products-header">

    <div class="container text-center">

        <h1>Our Products</h1>

        <p class="text-muted">
            Discover quality products at the best prices
        </p>

    </div>

</section>


<!-- ================= CATEGORY FILTER ================= -->

<section class="py-4">

    <div class="container">

        <div class="d-flex justify-content-center flex-wrap gap-2">

            <a href="/products"
               class="btn btn-dark">
                All
            </a>

            <a href="/products/category/Electronics"
               class="btn btn-outline-dark">
                <i class="fa-solid fa-laptop me-1"></i>
                Electronics
            </a>

            <a href="/products/category/Cloths"
               class="btn btn-outline-dark">
                <i class="fa-solid fa-shirt me-1"></i>
                Cloths
            </a>

            <a href="/products/category/Stationery"
               class="btn btn-outline-dark">
                <i class="fa-solid fa-pen me-1"></i>
                Stationery
            </a>

            <a href="/products/category/Jewelry"
               class="btn btn-outline-dark">
                <i class="fa-solid fa-gem me-1"></i>
                Jewelry
            </a>

            <a href="/products/category/Home"
               class="btn btn-outline-dark">
                <i class="fa-solid fa-house me-1"></i>
                Home Items
            </a>

        </div>

    </div>

</section>


<!-- ================= PRODUCTS ================= -->


<section class="products-section">

    <div class="container">

        <div class="row g-4">

            <!-- PRODUCT CARD -->
            <div class="col-lg-3 col-md-4 col-sm-6"
                 th:each="product : ${products}">

                <div class="card product-card h-100 shadow-sm">

                    <!-- PRODUCT IMAGE -->
                    <img th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         class="product-image">

                    <div class="card-body d-flex flex-column">

                        <!-- CATEGORY -->
                        <span class="product-category"
                              th:text="${product.category}">
                            Electronics
                        </span>

                        <!-- PRODUCT NAME -->
                        <h5 class="product-name"
                            th:text="${product.name}">
                            Product Name
                        </h5>

                        <!-- DESCRIPTION -->
                        <p class="product-description"
                           th:text="${product.description}">
                            Product description
                        </p>

                        <!-- PRICE -->
                        <div class="product-price">

                            ₹<span th:text="${product.price}">
                                999
                            </span>

                        </div>

                        <!-- BUTTONS -->
                        <div class="product-buttons">

                            <!-- VIEW -->
                            <a th:href="@{/products/{id}(id=${product.id})}"
                               class="btn btn-outline-dark w-50">

                                <i class="fa-solid fa-eye"></i>
                                View

                            </a>

                            <!-- CART -->
                            <button type="button"
                                    class="btn btn-dark w-50">

                                <i class="fa-solid fa-cart-plus"></i>
                                Cart

                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ================= NO PRODUCTS ================= -->

            <div class="col-12 text-center no-products"
                 th:if="${#lists.isEmpty(products)}">

                <i class="fa-solid fa-box-open fa-3x"></i>

                <h4>
                    No products available
                </h4>

                <p class="text-muted">
                    Please check again later.
                </p>

            </div>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
