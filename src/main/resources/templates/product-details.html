<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | ShopSphere</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	
		  
		  <!-- Navbar CSS -->
		  <link rel="stylesheet"
		        th:href="@{/css/navbar.css}">


		  <!-- Footer CSS -->
		  <link rel="stylesheet"
		  	   th:href="@{/css/footer.css}">
			   
			
			   <!-- product-details CSS -->
			   <link rel="stylesheet"
			   	   th:href="@{/css/product-details.css}">


</head>

<body>
	
	<!-- =========================
	     NAVBAR
	     ========================= -->

	<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- ================= PRODUCT DETAILS ================= -->

<div class="container product-details">

    <!-- Back Button -->

    <div class="mb-4">
        <a href="/products" class="back-link">
            <i class="fa-solid fa-arrow-left me-2"></i>
            Back to Products
        </a>
    </div>


    <div class="card border-0 shadow-sm product-card">

        <div class="row align-items-center g-4">

            <!-- PRODUCT IMAGE -->

            <div class="col-lg-6">

				<img th:src="${product.imageUrl}"
				     th:alt="${product.name}"
				     class="product-image">

            </div>


            <!-- PRODUCT INFORMATION -->

            <div class="col-lg-6">

                <div class="product-info">

                    <!-- Category -->

                    <span class="category"
                          th:text="${product.category}">
                        Jewelry
                    </span>


                    <!-- Product Name -->

                    <h1 class="product-title"
                        th:text="${product.name}">
                        Classic Watch
                    </h1>


                    <!-- Rating -->

                    <div class="rating mb-3">

                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>

                        <span class="text-muted ms-2">
                            (4.0)
                        </span>

                    </div>


                    <!-- Price -->

                    <div class="product-price">

                        ₹<span th:text="${product.price}">
                            1,999
                        </span>

                    </div>


                    <!-- Description -->

                    <p class="product-description"
                       th:text="${product.description}">

                        A stylish classic watch designed for everyday
                        wear. Elegant design, comfortable strap and
                        reliable performance make it a perfect choice
                        for every occasion.

                    </p>


                    <hr>


					<!-- ================= QUANTITY ================= -->

					<div class="quantity-box">

					    <label for="quantity"
					           class="fw-bold">

					        Quantity:

					    </label>

					    <input type="number"
					           id="quantity"
					           name="quantity"
					           class="form-control"
					           value="1"
					           min="1"
					           required>

					</div>


					<!-- ================= ACTION BUTTONS ================= -->

					<div class="d-flex gap-3 flex-wrap mt-3">

					    <!-- ADD TO CART -->

					    <form th:action="@{/cart/add/{id}(id=${product.id})}"
					          method="post">

					        <input type="hidden"
					               name="quantity"
					               id="cartQuantity"
					               value="1">

					        <button type="submit"
					                class="btn btn-primary btn-cart">

					            <i class="fa-solid fa-cart-plus me-2"></i>

					            Add to Cart

					        </button>

					    </form>


					    <!-- BUY NOW -->

					    <form th:action="@{/cart/buy-now/{id}(id=${product.id})}"
					          method="post">

					        <input type="hidden"
					               name="quantity"
					               id="buyQuantity"
					               value="1">

					        <button type="submit"
					                class="btn btn-success btn-buy">

					            <i class="fa-solid fa-bag-shopping me-2"></i>

					            Buy Now

					        </button>

					    </form>

					</div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- =========================
     FOOTER
     ========================= -->

<div th:replace="~{fragments/footer :: footer}"></div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/product-details.js}"></script>

</body>

</html>
