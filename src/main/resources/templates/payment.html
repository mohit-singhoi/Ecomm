<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Payment | ShopSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .payment-card {
            max-width: 560px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #212529;
        }

        .amount {
            font-size: 36px;
            font-weight: 700;
            color: #198754;
        }

        .pay-button {
            width: 100%;
            padding: 13px;
            font-size: 17px;
            font-weight: 600;
        }

        #paymentMessage {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="payment-card">

        <div class="brand mb-2">ShopSphere</div>

        <p class="text-muted">Secure online payment</p>

        <hr>

        <h5 class="mb-3">Complete Your Order</h5>

        <p class="text-muted mb-1">Amount to Pay</p>

        <div class="amount mb-4">
            ₹<span th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">
                0.00
            </span>
        </div>

        <div class="text-start mb-4">
            <p>
                <strong>Order ID:</strong>
                <span th:text="${shopSphereOrderId}"></span>
            </p>

            <p>
                <strong>Customer:</strong>
                <span th:text="${customerName}"></span>
            </p>

            <p>
                <strong>Payment Method:</strong> Online
            </p>
        </div>

        <button type="button"
                id="payButton"
                class="btn btn-success pay-button">
            Pay Securely
        </button>

        <div id="paymentMessage"
             class="text-muted"
             role="status"
             aria-live="polite"></div>

        <a th:href="@{/checkout}"
           class="btn btn-outline-secondary w-100 mt-3">
            Return to Checkout
        </a>

        <p class="small text-muted mt-4 mb-0">
            Your payment will be verified securely before your order is confirmed.
        </p>

    </div>
</div>

<!-- Razorpay payment verification form -->
<form id="verificationForm"
      th:action="@{/checkout/verify-payment}"
      method="post"
      hidden>

    <input type="hidden"
           name="shopSphereOrderId"
           th:value="${shopSphereOrderId}">

    <input type="hidden"
           name="razorpay_order_id">

    <input type="hidden"
           name="razorpay_payment_id">

    <input type="hidden"
           name="razorpay_signature">

</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script th:inline="javascript">
    const paymentConfig = {
        key: /*[[${razorpayKeyId}]]*/ "",
        amount: /*[[${amountInPaise}]]*/ 0,
        currency: /*[[${currency}]]*/ "INR",
        order_id: /*[[${razorpayOrderId}]]*/ "",

        name: "ShopSphere",
        description: "E-commerce Order Payment",

        prefill: {
            name: /*[[${customerName}]]*/ "",
            email: /*[[${customerEmail}]]*/ "",
            contact: /*[[${customerPhone}]]*/ ""
        },

        theme: {
            color: "#198754"
        },

        handler: function (response) {
            document.querySelector(
                '[name="razorpay_order_id"]'
            ).value = response.razorpay_order_id;

            document.querySelector(
                '[name="razorpay_payment_id"]'
            ).value = response.razorpay_payment_id;

            document.querySelector(
                '[name="razorpay_signature"]'
            ).value = response.razorpay_signature;

            document.getElementById("paymentMessage").textContent =
                "Payment received. Verifying your payment...";

            document.getElementById("payButton").disabled = true;

            document.getElementById("verificationForm").submit();
        },

        modal: {
            ondismiss: function () {
                document.getElementById("paymentMessage").textContent =
                    "Payment window closed. Your order is still awaiting payment.";
            }
        }
    };

    document.getElementById("payButton").addEventListener("click", function () {
        const message = document.getElementById("paymentMessage");

        if (typeof Razorpay === "undefined") {
            message.textContent =
                "Payment service could not load. Check your internet connection.";
            return;
        }

        if (!paymentConfig.key || !paymentConfig.order_id ||
            !paymentConfig.amount || paymentConfig.amount <= 0) {
            message.textContent =
                "Payment details are incomplete. Please return to checkout.";
            return;
        }

        const razorpay = new Razorpay(paymentConfig);

        razorpay.on("payment.failed", function (response) {
            message.textContent =
                response.error && response.error.description
                    ? response.error.description
                    : "Payment failed. Please try again.";
        });

        razorpay.open();
    });
</script>

</body>
</html>
