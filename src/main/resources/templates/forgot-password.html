<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - ShopSphere</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            font-family: Arial, Helvetica, sans-serif;
        }

        .forgot-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .forgot-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .brand-name {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #123b70;
        }

        .brand-name span {
            color: #1976d2;
        }

        .page-title {
            text-align: center;
            font-size: 23px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 0.2rem rgba(25, 118, 210, 0.15);
        }

        .reset-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.2s;
        }

        .reset-button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 14px;
            border-radius: 10px;
        }

        @media (max-width: 480px) {

            .forgot-card {
                padding: 30px 22px;
            }

            .brand-name {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">

        <!-- Logo -->
        <div class="logo-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <!-- Brand -->
        <div class="brand-name">
            Shop<span>Sphere</span>
        </div>

        <!-- Title -->
        <h2 class="page-title">
            Forgot Password?
        </h2>

        <p class="description">
            Don't worry! Enter the email address associated
            with your ShopSphere account and we'll send you
            a link to reset your password.
        </p>


        <!-- Success Message -->
        <div
            th:if="${successMessage}"
            class="alert alert-success"
            role="alert">

            <i class="fa-solid fa-circle-check me-2"></i>

            <span th:text="${successMessage}">
                Reset link sent successfully.
            </span>

        </div>


        <!-- Error Message -->
        <div
            th:if="${errorMessage}"
            class="alert alert-danger"
            role="alert">

            <i class="fa-solid fa-circle-exclamation me-2"></i>

            <span th:text="${errorMessage}">
                Something went wrong.
            </span>

        </div>


        <!-- Forgot Password Form -->

        <form
            th:action="@{/forgot-password}"
            method="post">

            <!-- CSRF -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="reset-button">

                <i class="fa-solid fa-paper-plane me-2"></i>

                Send Reset Link

            </button>

        </form>


        <!-- Back to Login -->

        <a
            th:href="@{/userlogin}"
            class="back-login">

            <i class="fa-solid fa-arrow-left me-2"></i>

            Back to Login

        </a>

    </div>

</div>

</body>

</html>
