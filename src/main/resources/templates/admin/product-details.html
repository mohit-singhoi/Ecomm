<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | ShopSphere Admin</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/admin-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-footer.css}">
    <link rel="stylesheet" th:href="@{/css/admin-products.css}">
</head>

<body>

    <!-- Admin Navbar -->
    <div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

    <main class="container py-5">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">Product Details</h2>
                <p class="text-muted">
                    View complete information about this product.
                </p>
            </div>

            <a th:href="@{/admin/products}"
               class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Products
            </a>

        </div>

        <!-- Product Details Card -->
        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <div class="row g-4">

                    <!-- Product Image -->
                    <div class="col-md-4">

                        <img th:if="${product.imageUrl != null
                                     and !product.imageUrl.isBlank()}"
                             th:src="${product.imageUrl}"
                             th:alt="${product.name}"
                             class="img-fluid rounded border"
                             style="width: 100%; max-height: 350px; object-fit: contain;">

                        <div th:unless="${product.imageUrl != null
                                          and !product.imageUrl.isBlank()}"
                             class="border rounded d-flex align-items-center justify-content-center"
                             style="height: 250px;">
                            <i class="fa-solid fa-image fa-3x text-muted"></i>
                        </div>

                    </div>

                    <!-- Product Information -->
                    <div class="col-md-8">

                        <span class="badge bg-primary mb-3"
                              th:text="${product.category}">
                            Category
                        </span>

                        <h3 class="fw-bold"
                            th:text="${product.name}">
                            Product Name
                        </h3>

                        <p class="text-muted">
                            Product ID:
                            <strong th:text="${product.id}"></strong>
                        </p>

                        <h3 class="text-success fw-bold my-3">
                            ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">
                                0.00
                            </span>
                        </h3>

                        <hr>

                        <h5 class="fw-bold">Description</h5>

                        <p class="text-muted"
                           style="white-space: pre-line;"
                           th:text="${product.description}">
                            Product description
                        </p>

                        <!-- Product Actions -->
                        <div class="d-flex flex-wrap gap-2 mt-4">

                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                               class="btn btn-primary">
                                <i class="fa-solid fa-pen-to-square"></i>
                                Edit Product
                            </a>

                            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this product?');">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <button type="submit" class="btn btn-danger">
                                    <i class="fa-solid fa-trash"></i>
                                    Delete Product
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Admin Footer -->
    <div th:replace="~{fragments/admin-footer :: adminFooter}"></div>

</body>
</html>
