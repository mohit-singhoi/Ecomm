<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | ShopSphere Admin</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/admin-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-footer.css}">
    <link rel="stylesheet" th:href="@{/css/admin-products.css}">
    <link rel="stylesheet" th:href="@{/css/admin-product-details.css}">
</head>

<body>

<!-- Existing Admin Navbar -->
<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

<main class="container py-5">

    <!-- Page Heading -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h2 class="fw-bold">Product Details</h2>
            <p class="text-muted">
                View complete information and manage product images.
            </p>
        </div>

        <a th:href="@{/admin/products}"
           class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Products
        </a>
    </div>

    <!-- Product Details Card -->
    <div class="card shadow-sm border-0 product-details-card">

        <div class="card-body p-4">

            <div class="row g-4">

                <!-- Product Image Gallery -->
                <div class="col-md-5">

                    <!-- Main Image -->
                    <div class="admin-main-image-container">

                        <img id="adminMainProductImage"
                             th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                             th:src="${product.imageUrl}"
                             th:alt="${product.name}"
                             class="admin-main-product-image">

                        <div id="adminImagePlaceholder"
                             th:if="${product.imageUrl == null or product.imageUrl.isBlank()}"
                             class="admin-image-placeholder">
                            <i class="fa-solid fa-image fa-3x text-muted"></i>
                        </div>

                    </div>

                    <!-- Uploaded Image Thumbnails -->
                    <div class="admin-thumbnail-gallery"
                         th:if="${productImages != null and !#lists.isEmpty(productImages)}">

                        <button type="button"
                                class="admin-thumbnail"
                                th:each="img, stat : ${productImages}"
                                th:classappend="${img.primaryImage} ? ' active' : ''"
                                th:attr="data-image-url=${img.imageUrl}"
                                th:aria-label="'View image ' + ${stat.count}">

                            <img th:src="${img.imageUrl}"
                                 th:alt="${product.name} + ' image ' + ${stat.count}">
                        </button>

                    </div>

                    <p class="text-muted small mt-2"
                       th:if="${productImages != null and !#lists.isEmpty(productImages)}"
                       th:text="${#lists.size(productImages)} + ' uploaded image(s)'">
                    </p>

                    <p class="text-muted small mt-2"
                       th:if="${productImages == null or #lists.isEmpty(productImages)}">
                        No additional uploaded images. Showing the existing product image.
                    </p>

                </div>

                <!-- Product Information -->
                <div class="col-md-7">

                    <span class="badge bg-primary mb-3"
                          th:text="${product.category}">
                        Category
                    </span>

                    <h3 class="fw-bold"
                        th:text="${product.name}">
                        Product Name
                    </h3>

                    <p class="text-muted">
                        Product ID:
                        <strong th:text="${product.id}"></strong>
                    </p>

                    <h3 class="text-success fw-bold my-3">
                        ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">
                            0.00
                        </span>
                    </h3>

                    <div class="mb-3">
                        <span class="badge"
                              th:classappend="${product.active} ? ' bg-success' : ' bg-secondary'"
                              th:text="${product.active} ? 'Active' : 'Inactive'">
                            Active
                        </span>
                    </div>

                    <hr>

                    <h5 class="fw-bold">Description</h5>

                    <p class="text-muted product-description"
                       th:text="${product.description != null and !product.description.isBlank()
                                  ? product.description : 'No description available.'}">
                        Product description
                    </p>

                    <!-- Existing Product Actions -->
                    <div class="d-flex flex-wrap gap-2 mt-4">

                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                           class="btn btn-primary">
                            <i class="fa-solid fa-pen-to-square me-1"></i>
                            Edit Product
                        </a>

                        <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete or deactivate this product?');">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit" class="btn btn-danger">
                                <i class="fa-solid fa-trash me-1"></i>
                                Delete Product
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<!-- Existing Admin Footer -->
<div th:replace="~{fragments/admin-footer :: adminFooter}"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const mainImage = document.getElementById("adminMainProductImage");
    const placeholder = document.getElementById("adminImagePlaceholder");
    const thumbnails = document.querySelectorAll(".admin-thumbnail");

    thumbnails.forEach(function (thumbnail) {

        thumbnail.addEventListener("click", function () {

            const imageUrl = thumbnail.getAttribute("data-image-url");

            if (!imageUrl) {
                return;
            }

            if (mainImage) {
                mainImage.src = imageUrl;
                mainImage.style.display = "block";
            } else if (placeholder) {
                const image = document.createElement("img");
                image.id = "adminMainProductImage";
                image.className = "admin-main-product-image";
                image.alt = thumbnail.querySelector("img")?.alt || "Product image";
                image.src = imageUrl;

                placeholder.replaceWith(image);
            }

            thumbnails.forEach(function (item) {
                item.classList.remove("active");
            });

            thumbnail.classList.add("active");
        });

    });

});
</script>

</body>
</html>
