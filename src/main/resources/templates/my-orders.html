<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | ShopSphere</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Navbar CSS -->

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">


    <!-- Footer CSS -->

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<!-- ================= MY ORDERS ================= -->

<section class="py-5">

    <div class="container">


        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">

                    <i class="fa-solid fa-box me-2"></i>

                    My Orders

                </h1>

                <p class="text-muted mb-0">

                    View your previous orders and order details.

                </p>

            </div>


            <a th:href="@{/products}"
               class="btn btn-outline-dark">

                <i class="fa-solid fa-shop me-2"></i>

                Continue Shopping

            </a>

        </div>



        <!-- ================= EMPTY ORDERS ================= -->

        <div th:if="${#lists.isEmpty(orders)}"
             class="text-center py-5">

            <i class="fa-solid fa-box-open fa-4x text-muted mb-4"></i>

            <h3>No Orders Found</h3>

            <p class="text-muted">

                You haven't placed any orders yet.

            </p>

            <a th:href="@{/products}"
               class="btn btn-dark">

                Start Shopping

            </a>

        </div>



        <!-- ================= ORDERS ================= -->

        <div th:unless="${#lists.isEmpty(orders)}">


            <div th:each="order : ${orders}"
                 class="card shadow-sm border-0 mb-4">


                <!-- ORDER HEADER -->

                <div class="card-header bg-white p-4">

                    <div class="row align-items-center">


                        <div class="col-md-3">

                            <small class="text-muted">
                                Order ID
                            </small>

                            <h5 class="mb-0">

                                #

                                <span th:text="${order.id}">
                                    1
                                </span>

                            </h5>

                        </div>



                        <div class="col-md-3">

                            <small class="text-muted">
                                Order Date
                            </small>

                            <div>

                                <span th:text="${order.orderDate}">
                                    Order Date
                                </span>

                            </div>

                        </div>



                        <div class="col-md-3">

                            <small class="text-muted">
                                Status
                            </small>

                            <div>

                                <span class="badge bg-warning text-dark"
                                      th:text="${order.status}">

                                    Pending

                                </span>

                            </div>

                        </div>



                        <div class="col-md-3 text-md-end">

                            <small class="text-muted">
                                Total Amount
                            </small>

                            <h5 class="mb-0">

                                ₹<span th:text="${order.totalAmount}">
                                    0
                                </span>

                            </h5>

                        </div>


                    </div>

                </div>



                <!-- ORDER BODY -->

                <div class="card-body p-4">


                    <h6 class="fw-bold mb-3">

                        <i class="fa-solid fa-cart-shopping me-2"></i>

                        Order Items

                    </h6>


                    <!-- ITEMS -->

                    <div th:each="item : ${order.orderItems}"
                         class="d-flex justify-content-between align-items-center border-bottom py-3">


                        <div>

                            <strong th:text="${item.productName}">
                                Product Name
                            </strong>

                            <div class="text-muted small">

                                ₹<span th:text="${item.productPrice}">
                                    0
                                </span>

                                ×

                                <span th:text="${item.quantity}">
                                    1
                                </span>

                            </div>

                        </div>


                        <div class="fw-bold">

                            ₹<span th:text="${item.productPrice * item.quantity}">
                                0
                            </span>

                        </div>


                    </div>


                </div>


            </div>


        </div>


    </div>

</section>



<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
