<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | ShopSphere</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Navbar CSS -->
    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <!-- Footer CSS -->
    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

    <style>

        body {
            background-color: #f8f9fa;
        }

        .orders-section {
            min-height: 70vh;
        }

        .order-card {
            border-radius: 14px;
            overflow: hidden;
            transition: 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
        }

        .order-header {
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .order-item {
            background: #ffffff;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 7px 12px;
            border-radius: 20px;
        }

        .price {
            font-weight: 600;
        }

        .empty-orders {
            background: #ffffff;
            border-radius: 16px;
            padding: 60px 20px;
        }

        .order-id {
            font-weight: 700;
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<!-- ================= MY ORDERS ================= -->

<section class="orders-section py-5">

    <div class="container">


        <!-- ================= HEADER ================= -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold mb-2">

                    <i class="fa-solid fa-box me-2"></i>

                    My Orders

                </h1>

                <p class="text-muted mb-0">

                    View your previous orders and order details.

                </p>

            </div>


            <a th:href="@{/products}"
               class="btn btn-outline-dark">

                <i class="fa-solid fa-shop me-2"></i>

                Continue Shopping

            </a>

        </div>



        <!-- ================= EMPTY ORDERS ================= -->

        <div th:if="${#lists.isEmpty(orders)}"
             class="empty-orders text-center shadow-sm">

            <i class="fa-solid fa-box-open fa-4x text-muted mb-4"></i>

            <h3 class="fw-bold">

                No Orders Found

            </h3>

            <p class="text-muted mb-4">

                You haven't placed any orders yet.

            </p>

            <a th:href="@{/products}"
               class="btn btn-dark">

                <i class="fa-solid fa-cart-shopping me-2"></i>

                Start Shopping

            </a>

        </div>



        <!-- ================= ORDERS ================= -->

        <div th:unless="${#lists.isEmpty(orders)}">


            <!-- EACH ORDER -->

            <div th:each="order : ${orders}"
                 class="card order-card shadow-sm border-0 mb-4">


                <!-- ================= ORDER HEADER ================= -->

                <div class="order-header p-4">

                    <div class="row align-items-center">


                        <!-- ORDER ID -->

                        <div class="col-md-3 mb-3 mb-md-0">

                            <small class="text-muted d-block mb-1">

                                Order ID

                            </small>

                            <span class="order-id">

                                #

								<span th:text="${order.id}">
								    1
								</span>

                            </span>

                        </div>



                        <!-- ORDER DATE -->

                        <div class="col-md-3 mb-3 mb-md-0">

                            <small class="text-muted d-block mb-1">

                                Order Date

                            </small>

                            <span th:text="${order.orderDate}">

                                Order Date

                            </span>

                        </div>



                        <!-- STATUS -->

                        <div class="col-md-3 mb-3 mb-md-0">

                            <small class="text-muted d-block mb-1">

                                Status

                            </small>

                            <span class="badge status-badge bg-warning text-dark"
                                  th:text="${order.status}">

                                Pending

                            </span>

                        </div>



                        <!-- TOTAL -->

                        <div class="col-md-3 text-md-end">

                            <small class="text-muted d-block mb-1">

                                Total Amount

                            </small>

                            <h5 class="fw-bold mb-0">

                                ₹<span th:text="${order.totalAmount}">
                                    0
                                </span>

                            </h5>

                        </div>


                    </div>

                </div>



                <!-- ================= ORDER BODY ================= -->

                <div class="card-body p-4">


                    <h6 class="fw-bold mb-3">

                        <i class="fa-solid fa-cart-shopping me-2"></i>

                        Order Items

                    </h6>



                    <!-- ORDER ITEMS -->

                    <div th:each="item : ${order.orderItems}"
                         class="order-item d-flex justify-content-between align-items-center border-bottom py-3">


                        <!-- PRODUCT INFORMATION -->

                        <div>

                            <strong th:text="${item.productName}">

                                Product Name

                            </strong>

                            <div class="text-muted small mt-1">

                                ₹<span th:text="${item.productPrice}">
                                    0
                                </span>

                                ×

                                <span th:text="${item.quantity}">
                                    1
                                </span>

                            </div>

                        </div>



                        <!-- ITEM TOTAL -->

                        <div class="price">

                            ₹<span th:text="${item.productPrice * item.quantity}">
                                0
                            </span>

                        </div>


                    </div>


                </div>


            </div>


        </div>


    </div>

</section>



<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
