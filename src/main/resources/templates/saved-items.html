<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Saved Items | ShopSphere</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- Navbar -->

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <link rel="stylesheet"
          th:href="@{/css/user-navbar.css}">


    <!-- Saved Items -->

    <link rel="stylesheet"
          th:href="@{/css/saved-items.css}">
		  
		  
		  <!-- FOOTER CSS -->
		  <!-- ================================================= -->

		  <link rel="stylesheet"
		        th:href="@{/css/footer.css}">

</head>

<body>


    <!-- =====================================================
         LOGGED-IN NAVBAR
         ===================================================== -->

    <div th:replace="~{fragments/user-navbar :: userNavbar}"></div>


    <!-- =====================================================
         SAVED ITEMS
         ===================================================== -->

    <main class="saved-page">

        <div class="container py-5">


            <!-- HEADER -->

            <div class="saved-heading">

                <div>

                    <h1>

                        <i class="fa-regular fa-heart me-2"></i>

                        Saved Items

                    </h1>

                    <p>
                        Products you saved for later.
                    </p>

                </div>


                <a th:href="@{/products}"
                   class="btn btn-dark">

                    <i class="fa-solid fa-store me-2"></i>

                    Continue Shopping

                </a>

            </div>


            <!-- =================================================
                 EMPTY SAVED ITEMS
                 ================================================= -->

            <div th:if="${savedItems == null || #lists.isEmpty(savedItems)}"
                 class="empty-saved">

                <div class="empty-icon">

                    <i class="fa-regular fa-heart"></i>

                </div>

                <h3>
                    No Saved Items
                </h3>

                <p>
                    You haven't saved any products yet.
                </p>

                <a th:href="@{/products}"
                   class="btn btn-dark">

                    Browse Products

                </a>

            </div>


            <!-- =================================================
                 SAVED PRODUCTS
                 ================================================= -->

            <div th:if="${savedItems != null && !#lists.isEmpty(savedItems)}"
                 class="saved-grid">


                <div class="saved-card"
                     th:each="item : ${savedItems}">


                    <!-- PRODUCT IMAGE -->

                    <div class="saved-image">

                        <img th:src="${item.product.imageUrl}"
                             th:alt="${item.product.name}">

                    </div>


                    <!-- PRODUCT INFO -->

                    <div class="saved-info">

                        <h3 th:text="${item.product.name}">
                            Product Name
                        </h3>


                        <p class="saved-category"
                           th:text="${item.product.category}">
                            Category
                        </p>


                        <div class="saved-price">

                            ₹<span th:text="${item.product.price}">
                                0.0
                            </span>

                        </div>


                        <div class="saved-actions">

                            <!-- MOVE TO CART -->

                            <form th:action="@{/saved-items/move-to-cart/{id}(id=${item.id})}"
                                  method="post">

                                <button type="submit"
                                        class="btn btn-dark">

                                    <i class="fa-solid fa-cart-plus me-1"></i>

                                    Move to Cart

                                </button>

                            </form>


                            <!-- REMOVE -->

                            <form th:action="@{/saved-items/remove/{id}(id=${item.id})}"
                                  method="post">

                                <button type="submit"
                                        class="btn btn-outline-danger">

                                    <i class="fa-regular fa-trash-can me-1"></i>

                                    Remove

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <div th:replace="~{fragments/footer :: footer}"></div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
